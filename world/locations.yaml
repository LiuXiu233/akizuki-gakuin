# ============================================================
# 地点表 (locations.yaml)
# 静态初始地点。运行中新增地点必须通过 register_location() 写入
# state/world_registry.json，不要手改本文件。
# zone 用于计算移动时间，见 travel 段。
# ============================================================

travel:
  within_zone_minutes:
    school_indoor: 3
    school_outdoor: 5
    town_center: 6
    riverside: 8
    residential: 5
    far: 12
  between_zone_minutes:
    school_indoor|school_outdoor: 5
    school_indoor|town_center: 20
    school_indoor|riverside: 18
    school_indoor|residential: 22
    school_indoor|far: 45
    school_outdoor|town_center: 18
    school_outdoor|riverside: 15
    school_outdoor|residential: 20
    school_outdoor|far: 42
    town_center|riverside: 10
    town_center|residential: 12
    town_center|far: 35
    riverside|residential: 12
    riverside|far: 30
    residential|far: 38
  default_minutes: 20

locations:

