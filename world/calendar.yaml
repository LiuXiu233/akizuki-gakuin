# ============================================================
# 学年日历 (calendar.yaml)
# 日期格式 MM-DD；引擎按当前年份匹配。
# ============================================================

academic_year:
  start: "04-08"
  end: "03-20"
  terms:
    - {id: term_1, name: "第一学期", start: "04-08", end: "07-20"}
    - {id: term_summer, name: "暑假", start: "07-21", end: "08-31"}
    - {id: term_2, name: "第二学期", start: "09-01", end: "12-24"}
    - {id: term_winter, name: "寒假", start: "12-25", end: "01-07"}
    - {id: term_3, name: "第三学期", start: "01-08", end: "03-20"}

weather:
  # 每月天气权重，roll_random_event / 世界模拟使用
  4: {sunny: 5, cloudy: 3, rain: 2, sakura_wind: 2}
  5: {sunny: 6, cloudy: 3, rain: 2}
  6: {rain: 6, cloudy: 4, sunny: 2}
  7: {sunny: 6, hot: 4, cloudy: 2, rain: 2}
  8: {hot: 7, sunny: 4, thunder: 2}
  9: {sunny: 4, cloudy: 3, rain: 3, typhoon: 1}
  10: {sunny: 6, cloudy: 3, rain: 2}
  11: {sunny: 5, cloudy: 4, cold: 2}
  12: {cold: 5, cloudy: 4, sunny: 3, snow: 1}
  1: {cold: 6, cloudy: 3, snow: 2, sunny: 2}
  2: {cold: 6, cloudy: 3, snow: 2, sunny: 2}
  3: {sunny: 5, cloudy: 3, rain: 2, warm: 2}

