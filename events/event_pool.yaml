# ============================================================
# 事件模板池 (event_pool.yaml)
# 触发由 engine/event_manager.py 决定，LLM 只负责叙事。
#
# conditions 支持的键:
#   time_blocks / not_time_blocks : blk_* (见 world/schedule.yaml)
#   locations / location_tags / not_locations
#   weekday / day_type / season_months / weather
#   requires_npc (bool) / npc_tags / npc_stage_min / npc_stage_in
#   min_relationship: {dim: value}  max_relationship: {dim: value}
#   player_energy_min / player_energy_max / player_stress_min / player_stress_max
#   calendar_tags / requires_club / requires_skill / requires_knowledge
#   min_day_index / requires_flag
#
# weight  : 基础权重 (相对)
# cooldown_days : 冷却
# major   : true 的事件受 major_event_min_interval_days 限制（重大情感事件必须低频）
# prompt  : 给 Agent 的导演提示（不是台词，也不是结局）
# ============================================================

meta:
  version: 1
  categories: [daily, romance, friendship, club, school_event, drama]
  ratio_target: {daily: 0.40, romance: 0.25, friendship: 0.15, club: 0.10, school_event: 0.07, drama: 0.03}
  rule: "事件只提供'发生了什么契机'，不提供结果。结果由玩家选择与 NPC 的自主决定产生。"

events:

