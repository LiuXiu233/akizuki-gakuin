# ============================================================
# 多 Agent 模式 —— 完整流水线。分工最清晰、信息隔离最严格。
# 每回合约 5~8 次模型调用，成本与延迟最高，效果最好。
# ============================================================

id: multi
name: 多 Agent 流水线
description: "主控解析 → 裁判结算 → NPC 并行反应 → 旁白合成 → 导演收尾 →（可选）画师出图。"
max_tool_iterations: 6

stages:
  - id: intent
    name: 主控解析
    role: main
    temperature: 0.4
    max_tokens: 1600
    # 世界快照已经在 system 里给了时间/地点/在场角色/关系标签/推荐上下文，
    # 这里只保留"快照里没有的"几样，避免把已知信息再查一遍
    tools: [get_relevant_memories, get_character_state, get_schedule, should_check]
    max_tool_iterations: 3
    output: json
    output_hint: plan
    produces: [plan]
    prompt: |
      只读世界，不要改变任何东西。把玩家的自然语言拆成有序的、可执行的步骤。

      **上面的世界快照已经给了你时间、地点、在场角色、关系标签、玩家状态和推荐上下文，
      不要再用工具去查这些。** 只有需要"某个角色的记忆/详细设定/日程"时才调用工具，
      而且最多查两次。
      玩家可能一次说多个意图，按顺序列出；如果某一步依赖前一步的结果，在 description 里写清楚。
      判断每一步是否需要检定（可以调用 should_check 确认）。

  - id: resolve
    name: 裁判结算
    role: judge
    temperature: 0.2
    max_tokens: 2200
    tools: [perform_action, resolve_check, move_character, buy_item, advance_time, sleep,
            apply_relationship_event, npc_decide_invitation, npc_decide_confession,
            add_memory, join_club, leave_club, create_npc, promote_npc,
            register_skill, register_knowledge, register_location, register_group,
            add_dynamic_interest, get_character_state, get_relationship, get_nearby_characters]
    output: json
    output_hint: facts
    produces: [facts]
    inputs: [plan]
    prompt: |
      按主控给出的步骤依次结算。每一步都必须真的调用工具。
      如果某一步已经不可能（对方不在、店关门了、钱不够、太晚了），跳过它并记在 blocked 里，
      **不要强行让它发生**。
      需要新 NPC / 新地点 / 新技能时，先查重再注册。

  - id: npc_react
    name: NPC 反应
    role: npc
    for_each: nearby_npcs
    max_subjects: 4
    parallel: true
    temperature: 0.9
    max_tokens: 900
    tools: []
    produces: [dialogue]
    inputs: [facts]

  - id: narrate
    name: 旁白合成
    role: narrator
    temperature: 0.85
    max_tokens: 2600
    tools: []
    produces: [narration]
    inputs: [plan, facts, dialogue]
    prompt: |
      把这一回合写成一段连贯的场景。NPC 的台词已经给出，原样使用、不要改写内容，
      但可以调整它们出现的顺序和穿插的动作。
      不要复述数值，不要写检定过程，不要替玩家做决定。

  - id: direct
    name: 导演收尾
    role: director
    temperature: 0.7
    max_tokens: 1600
    tools: [end_turn, get_action_context, record_recommendations]
    output: json
    output_hint: recommendations
    produces: [recommendations]
    inputs: [facts, narration]
    prompt: |
      先调用 end_turn 收尾这一回合（后台世界模拟、随机事件、NPC 晋升、自动存档），
      再根据它返回的 action_context 给出 3~5 条推荐行动，最后调用 record_recommendations 记录。

  - id: illustrate
    name: 画师
    role: illustrator
    optional: true                  # 未配置文生图时自动跳过
    requires: images_enabled
    temperature: 0.7
    max_tokens: 1000
    tools: []
    output: json
    output_hint: images
    produces: [images]
    inputs: [narration]
    prompt: |
      判断这一回合是否值得出图。大多数回合不需要——只在场景切换、
      第一次见到某个角色、或情绪高点时出图。

# ------------------------------------------------------------
# 关于推理模型（DeepSeek v4 / o 系列 / gpt-5 等）
# ------------------------------------------------------------
# 这类模型会先花一大段 token 思考再输出正文。一个 multi 回合有 5~10 次调用，
# 全开推理会让每回合多花 3 倍时间和费用。
#
# 关掉（推荐，工具调用不受影响）：在服务器 .env 里设置
#     AKIZUKI_LLM_EXTRA_PARAMS={"reasoning_effort":"none"}
#
# 只给某个阶段开推理：在该阶段加
#     extra_params: {reasoning_effort: "medium"}
#
# 非推理模型不要设这个参数——OpenAI 的 gpt-4o 一类收到会直接报错。
